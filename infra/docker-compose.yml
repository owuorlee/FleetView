# Local dev environment: PostgreSQL 16 + Traccar 6.x
# Usage:  docker compose up -d
# Traccar web UI: http://localhost:8082 (admin/admin on first run — change it)
# Device ports exposed: 5023 (gt06), 5027 (teltonika)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  traccar:
    image: traccar/traccar:6.14
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8082"   # web UI / REST API / WebSocket
      - "5023:5023"   # gt06 protocol (verified traccar.org/devices)
      - "5027:5027"   # teltonika protocol
    volumes:
      - ./traccar/traccar.xml:/opt/traccar/conf/traccar.xml:ro
      - ./data/traccar/logs:/opt/traccar/logs
